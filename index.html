<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HENTAI FIGURE SHELF</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#111;
 color:#eee;
 font-family:Arial,"Noto Sans JP",sans-serif;
}

header{
 position:sticky;
 top:0;
 z-index:10;
 background:#090909;
 border-bottom:1px solid #333;
 padding:18px 24px;
}

.header{
 max-width:1200px;
 margin:auto;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.logo{
 font-size:22px;
 font-weight:900;
 letter-spacing:.08em;
}

.logo span{
 color:#e43b70;
}

main{
 max-width:1200px;
 margin:auto;
 padding:55px 24px 100px;
}

.hero{
 margin-bottom:60px;
}

.hero small{
 color:#e43b70;
 font-weight:bold;
 letter-spacing:.15em;
}

.hero h1{
 font-size:clamp(42px,8vw,90px);
 line-height:.9;
 margin:15px 0;
}

.hero p{
 color:#aaa;
 line-height:1.8;
 max-width:650px;
}

.section-title{
 border-top:2px solid #eee;
 padding-top:14px;
 margin-bottom:25px;
 font-weight:bold;
}

.grid{
 display:grid;
 grid-template-columns:
 repeat(auto-fill,minmax(220px,1fr));
 gap:18px;
}

.card{
 background:#1b1b1b;
 border:1px solid #333;
 cursor:pointer;
 transition:.2s;
}

.card:hover{
 transform:translateY(-4px);
 border-color:#e43b70;
}

.image{
 aspect-ratio:1;
 background:#292929;
 display:flex;
 align-items:center;
 justify-content:center;
 color:#777;
}

.info{
 padding:17px;
}

.maker{
 color:#999;
 font-size:11px;
 margin-bottom:7px;
}

.name{
 font-size:18px;
 font-weight:bold;
}

.meta{
 margin-top:12px;
 color:#999;
 font-size:12px;
}

.notice{
 margin-top:60px;
 padding:18px;
 border:1px solid #444;
 color:#999;
 font-size:12px;
 line-height:1.7;
}

.modal{
 display:none;
 position:fixed;
 inset:0;
 z-index:100;
 background:#000c;
 padding:20px;
 overflow:auto;
}

.modal.show{
 display:block;
}

.modal-box{
 max-width:900px;
 margin:30px auto;
 background:#181818;
 border:1px solid #444;
}

.modal-head{
 display:flex;
 justify-content:space-between;
 padding:15px 20px;
 border-bottom:1px solid #333;
}

.close{
 border:0;
 background:none;
 color:white;
 font-size:28px;
 cursor:pointer;
}

.detail{
 display:grid;
 grid-template-columns:1fr 1fr;
}

.detail-image{
 min-height:450px;
 background:#292929;
 display:flex;
 align-items:center;
 justify-content:center;
 color:#777;
}

.detail-info{
 padding:35px;
}

.detail-info h2{
 font-size:34px;
 margin-top:0;
}

.row{
 padding:14px 0;
 border-bottom:1px solid #333;
}

.row b{
 display:inline-block;
 width:110px;
 color:#999;
}

@media(max-width:700px){
 .detail{
  grid-template-columns:1fr;
 }

 .detail-image{
  min-height:300px;
 }
}
</style>
</head>

<body>

<header>
<div class="header">
<div class="logo">
HENTAI <span>FIGURE SHELF</span>
</div>
</div>
</header>

<main>

<section class="hero">

<small>ADULT FIGURE DATABASE</small>

<h1>
HENTAI<br>
FIGURE SHELF
</h1>

<p>
成人向けフィギュアを中心に、
フィギュアそのものを主役として記録・共有する
データベース。
</p>

</section>

<section>

<div class="section-title">
FIGURES
</div>

<div id="grid" class="grid"></div>

</section>

<div class="notice">
このサイトでは成人向けフィギュアを扱います。
閲覧・利用にあたっては、利用者の居住地域および
各サービスの利用規約に従ってください。
</div>

</main>

<div id="modal" class="modal">

<div class="modal-box">

<div class="modal-head">
<b>FIGURE</b>
<button class="close" onclick="closeModal()">×</button>
</div>

<div class="detail">

<div class="detail-image">
NO IMAGE
</div>

<div class="detail-info">

<h2 id="d-name"></h2>

<div class="row">
<b>メーカー</b>
<span id="d-maker"></span>
</div>

<div class="row">
<b>作品</b>
<span id="d-series"></span>
</div>

<div class="row">
<b>キャラクター</b>
<span id="d-character"></span>
</div>

<div class="row">
<b>スケール</b>
<span id="d-scale"></span>
</div>

</div>

</div>

</div>

</div>

<script>

const figures=[

{
 name:"サンプルフィギュア A",
 maker:"メーカー名",
 series:"作品名",
 character:"キャラクター名",
 scale:"1/7"
},

{
 name:"サンプルフィギュア B",
 maker:"メーカー名",
 series:"作品名",
 character:"キャラクター名",
 scale:"1/6"
},

{
 name:"サンプルフィギュア C",
 maker:"メーカー名",
 series:"作品名",
 character:"キャラクター名",
 scale:"1/4"
}

];

const grid=document.getElementById("grid");

figures.forEach((f,i)=>{

 const card=document.createElement("div");

 card.className="card";

 card.innerHTML=`
 <div class="image">NO IMAGE</div>
 <div class="info">
   <div class="maker">${f.maker}</div>
   <div class="name">${f.name}</div>
   <div class="meta">${f.series}</div>
 </div>
 `;

 card.onclick=()=>openModal(i);

 grid.appendChild(card);

});

function openModal(i){

 const f=figures[i];

 document.getElementById("d-name").textContent=f.name;
 document.getElementById("d-maker").textContent=f.maker;
 document.getElementById("d-series").textContent=f.series;
 document.getElementById("d-character").textContent=f.character;
 document.getElementById("d-scale").textContent=f.scale;

 document.getElementById("modal")
 .classList.add("show");
}

function closeModal(){

 document.getElementById("modal")
 .classList.remove("show");

}

</script>

</body>
</html>
